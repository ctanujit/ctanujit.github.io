hero:
  eyebrow: "Research group"
  title: "ForeML Lab"
  rotating_prefix: "Fusing statistics and machine learning to"
  rotating_lines:
    - "forecast complex spatiotemporal systems"
    - "build statistically principled learning models"
    - "advance health AI"
    - "develop scientific generative models"
  lead: >-
    ForeML Lab is a non-profit research group led by Tanujit Chakraborty, developing statistically principled machine-learning methods for forecasting, health, climate and complex dynamical systems.
  logo:
    src: /assets/images/foreml/logo.png
    alt: "ForeML Lab"

group_photo:
  src: /assets/images/foreml/group.jpg
  alt: "ForeML Lab group photograph"
  caption: "ForeML Lab · Abu Dhabi"

featured_research:
  - publication_id: panja-2023-epicasting-an-ensemble-wavelet-neural-network
    image: /assets/images/foreml/research/epicasting.png
