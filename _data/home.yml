research_intro: The work is application-driven. The primary interest is statistical machine learning, with emphasis on time
  series forecasting, spatial data science, and health data sciences, including statistical methodology for epidemiology,
  biology, mobile health, business, software reliability, quality engineering, and macroeconomics.
