introduction: '[Tanujit Chakraborty](https://www.sorbonne.ae/team/tanujit-chakraborty) is an Associate Professor of Mathematics
  (Statistics & Data Science) in the School of Data Science and Engineering at [Sorbonne University Abu Dhabi](https://www.sorbonne.ae/),
  and a member of the [Sorbonne Center for Artificial Intelligence (SCAI)](https://scai.sorbonne-universite.fr/) at Sorbonne
  University, Paris. He is an Adjunct Associate Professor at [Duke-NUS Medical School](https://www.duke-nus.edu.sg/home),
  [National University of Singapore](https://www.nus.edu.sg/), and an affiliated faculty member at [CIDSAI, NYU Abu Dhabi](https://www.cids.ai/).'
