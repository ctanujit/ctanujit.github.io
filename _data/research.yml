title: "Statistical AI and Time Series Forecasting"
intro: >-
  I work on application-driven theory, meaning that most of my research focuses on designing theoretically principled statistical and machine-learning models that directly address real-world problems. Much of this work is guided by the belief that effective algorithms often emerge from simple, aesthetically elegant ideas.

