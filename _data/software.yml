# Packages named on https://www.ctanujit.org/softwares.html
# Paper-specific GitHub repositories stay on the publication records.
# Replace an illustration by changing image.src (and fallback).
# Optional display.scale / display.position adjust the crop without editing CSS.
# Add a package by appending a record; the Software page iterates this file.
- id: engressionts
  name: engressionts
  language: python
  ecosystem: PyPI
  install: pip install engressionts
  summary: Engression for  time series forecasting  
  url: https://pypi.org/project/engressionts/
  image:
    src: /assets/images/software/engressionts-clean.png
    fallback: /assets/images/software/engressionts-clean.png
    alt: "EngressionTS: Probabilistic time series forecasting via Engression"
  display:
    scale: 1.12
    position: right center
