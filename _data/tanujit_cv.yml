bio:
  permission: The following bio and [**this photo**]({MEDIA_PHOTO}) may be used in media releases without further permission.
  text: Dr. Tanujit Chakraborty is an **Associate Professor of Statistics and Data Science** at [Sorbonne University Abu Dhabi](https://www.sorbonne.ae/),
    UAE and the [Sorbonne Center for Artificial Intelligence (SCAI)](https://scai.sorbonne-universite.fr/), Paris, France.
    He is also an **Adjunct Associate Professor** at [Duke-NUS Medical School](https://www.duke-nus.edu.sg/home), National
    University of Singapore, and an affiliated faculty member at [CIDSAI, NYU Abu Dhabi](https://www.cids.ai/). He earned
    his **Habilitation (HDR) in Mathematics** from Sorbonne Université, Paris, and a **PhD in Statistical AI** from the Indian
    Statistical Institute (ISI), Kolkata, where he studied statistical machine learning and spatial time series. His work
    integrates statistical learning, graph theory, and deep learning, with an emphasis on developing models that can reason
    about structured and temporal data. He has maintained an active consulting practice, assisting PharmaACE, ITC Limited,
    and Bajaj Finserv Corporation.
