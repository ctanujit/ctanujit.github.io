hero:
  eyebrow: TEACHING
  title: Teaching
  lead: "I teach courses in statistics, data science, machine learning and quantitative methods, with a focus on real-world applications and problem-driven learning."
  image: "/assets/images/teaching/featured/teaching-hero-tanujit.jpg"
  image_alt: "Illustrated classroom scene with Tanujit Chakraborty teaching statistics and data science topics"

