<header class="site-header">
  <div class="wrap header-bar">
    <p class="site-name"><a href="{{ '/' | relative_url }}">{{ site.data.profile.display_name | default: site.title }}</a></p>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <ul class="nav-main">
        {% for item in site.data.navigation %}
        <li{% if item.children %} class="has-sub"{% endif %}>
          {% if item.url %}
          <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
          {% else %}
          <button type="button" class="nav-label" aria-expanded="false">{{ item.label }}</button>
          {% endif %}
          {% if item.children %}
          <ul>
            {% for child in item.children %}
            <li><a href="{{ child.url | relative_url }}">{{ child.label }}</a></li>
            {% endfor %}
          </ul>
          {% endif %}
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
