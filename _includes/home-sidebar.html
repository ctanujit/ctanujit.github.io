{% assign home = site.data.home %}
<aside class="home-sidebar" aria-label="Profile">
  <div class="home-profile-card">

    <a class="home-profile-photo-link"
       href="{{ home.profile.full_image | default: home.profile.image | relative_url }}"
       target="_blank"
       rel="noopener"
       title="Open full-size portrait">
      <img class="home-profile-photo"
           src="{{ home.profile.image | relative_url }}"
           alt="{{ home.profile.image_alt }}">
    </a>

    <h1 class="home-profile-name">{{ home.profile.name }}</h1>
    <p class="home-profile-title">{{ home.profile.title }}</p>
    <p class="home-profile-institution">{{ home.profile.institution }}</p>

    <nav class="home-profile-links" aria-label="Academic profiles">
      {% for item in home.links %}
        <a href="{{ item.url }}"
           {% unless item.url contains 'mailto:' %}target="_blank" rel="noopener noreferrer"{% endunless %}>
          {{ item.label }}
        </a>
      {% endfor %}
    </nav>

    <a class="home-cv-button" href="{{ home.profile.cv_url | relative_url }}">
      <span>{{ home.profile.cv_label | default: 'CV' }}</span>
      <span aria-hidden="true">→</span>
    </a>

  </div>
</aside>
