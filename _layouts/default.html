<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title != "" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.robots %}
  <meta name="robots" content="{{ page.robots }}">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body>
  {% include header.html %}
  <main id="content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/nav.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/links.js' | relative_url }}"></script>
  {% if page.url == "/" %}
  <script src="{{ '/assets/js/contact.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  {% endif %}
  {% if page.collection == "software" %}
  <script src="{{ '/assets/js/software.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  {% endif %}
  {% if page.collection == "talks" %}
  <script src="{{ '/assets/js/talks.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  {% endif %}
</body>
</html>
