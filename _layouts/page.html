---
layout: default
---
<article class="prose wrap{% if page.cv %} cv-page{% endif %}{% if page.collection == 'software' %} software-article{% endif %}">
  {% unless page.collection == "software" or page.collection == "publications" %}
  <h1>{{ page.title }}</h1>
  {% endunless %}
  {% if page.historical %}
  <p class="historical">Historical page. Kept for the record. The current page is linked from the menu.</p>
  {% endif %}
  {{ content }}
</article>
